<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HobiX Global Skill Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #00f2fe;
            --bg-dark: #0a0a1f;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #43e97b;
            --pink: #f5576c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            position: relative; 
            overflow-x: hidden; 
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseBg 8s ease-in-out infinite;
        }

        @keyframes pulseBg {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .login-card {
            background: rgba(15, 15, 35, 0.7); 
            border: 1px solid var(--card-border);
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 460px; 
            backdrop-filter: blur(20px);
            z-index: 10; 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 100px rgba(0, 242, 254, 0.1);
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .brand-logo i {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--accent), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand { 
            font-size: 2.2rem; 
            font-weight: 800; 
            text-align: center; 
            margin-bottom: 8px; 
            background: linear-gradient(135deg, #00f2fe, #4facfe); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 1px;
        }

        .subtitle { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            margin-bottom: 30px; 
        }

        .form-group { 
            margin-bottom: 20px; 
            position: relative;
        }

        .form-label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            font-weight: 500; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-box { 
            width: 100%; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid var(--card-border); 
            border-radius: 12px; 
            padding: 13px 16px 13px 42px; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.3s; 
        }

        .input-box:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); 
            background: rgba(0,0,0,0.5);
        }

        .input-box:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1rem; 
            border: none; 
            cursor: pointer; 
            transition: all 0.3s; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #fff; 
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover { 
            opacity: 0.95; 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); 
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }

        .btn-reset { 
            width: 100%; 
            padding: 11px; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            border: 1px dashed rgba(245, 87, 108, 0.5); 
            cursor: pointer; 
            background: rgba(245, 87, 108, 0.08); 
            color: var(--pink); 
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-reset:hover { 
            background: var(--pink); 
            color: #fff;
            border-style: solid;
            transform: translateY(-1px);
        }

        .footer-text { 
            text-align: center; 
            margin-top: 25px; 
            font-size: 0.9rem; 
            color: var(--text-muted); 
        }

        .footer-text a { 
            color: var(--accent); 
            text-decoration: none; 
            font-weight: 600; 
            transition: all 0.2s;
        }

        .footer-text a:hover { 
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Alert Toast */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #0f1026;
            border-left: 4px solid var(--success);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.4s ease;
            color: #fff;
            font-size: 0.9rem;
            min-width: 280px;
        }

        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--pink); }
    </style>
</head>
<body>

    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>

    <!-- Floating Particles -->
    <div class="particle" style="width:8px; height:8px; left:10%; animation-delay:0s;"></div>
    <div class="particle" style="width:6px; height:6px; left:25%; animation-delay:3s;"></div>
    <div class="particle" style="width:10px; height:10px; left:50%; animation-delay:5s;"></div>
    <div class="particle" style="width:5px; height:5px; left:70%; animation-delay:7s;"></div>
    <div class="particle" style="width:7px; height:7px; left:85%; animation-delay:9s;"></div>

    <div class="login-card">
        <div class="brand-logo">
            <i class="fa-solid fa-shapes"></i>
        </div>
        <div class="brand">HobiX</div>
        <p class="subtitle">Welcome back! Sign in to continue your skill exchange journey.</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <div class="input-wrapper">
                    <input type="text" id="loginIdentifier" class="input-box" placeholder="e.g. haroon or haroon@example.com" required>
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" class="input-box" placeholder="Enter your password" required>
                    <i class="fa-solid fa-lock input-icon"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to HobiX
            </button>
        </form>

        <div class="divider">OR</div>

        <button type="button" class="btn-reset" onclick="clearAllData()">
            <i class="fa-solid fa-trash-can"></i> Reset Database (Delete All Accounts)
        </button>

        <div class="footer-text">
            Don't have an account? <a href="signup.html">Create Account Here</a>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMsg">Message</span>
    </div>

    <script>
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.className = 'toast show';
            if (isError) toast.classList.add('error');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        function playSound(freq = 523.25) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        function handleLogin(event) {
            event.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            
            const db = JSON.parse(localStorage.getItem('hobix_global_users_db') || '[]');

            // Find user by username OR email
            const user = db.find(u => 
                (u.username && u.username.toLowerCase() === identifier) || 
                (u.email && u.email.toLowerCase() === identifier)
            );

            if (!user) {
                showToast('❌ Account not found. Please sign up first!', true);
                playSound(220);
                return;
            }

            // Check password (if user has one saved)
            if (user.password && user.password !== password) {
                showToast('❌ Incorrect password. Please try again.', true);
                playSound(220);
                return;
            }

            // Success - save session and redirect
            localStorage.setItem('hobix_current_user', JSON.stringify(user));
            showToast(`✅ Welcome back, ${user.firstName}! Redirecting...`);
            playSound(659.25);
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1200);
        }

        function clearAllData() {
            const confirmed = confirm('⚠️ WARNING: This will permanently delete ALL accounts, workshops, chats, and data from the platform.\n\nAre you absolutely sure you want to start fresh?');
            
            if (confirmed) {
                localStorage.clear();
                showToast('✅ All data cleared! Platform is now 100% clean.');
                playSound(783.99);
                
                setTimeout(() => {
                    window.location.href = 'signup.html';
                }, 1500);
            }
        }
    </script>
</body>
</html>
